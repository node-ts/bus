version: 2.1

defaults: &defaults
  working_directory: ~/repo
  docker:
    - image: node:24.11.1

jobs:
  build:
    working_directory: ~/repo
    docker:
      - image: node:24.11.1
        environment:
          # Secondary containers share the primary's network. Use 127.0.0.1 so node doesn't try ::1 first
          LOCALSTACK_ENDPOINT: http://127.0.0.1:4566
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1
          POSTGRES_URL: postgres://postgres:password@127.0.0.1:5432/postgres
          MONGODB_URL: mongodb://127.0.0.1:27017/workflows
      - image: rabbitmq:3-management
      - image: localstack/localstack:3
        environment:
          SERVICES: sqs,sns,iam,sts
      - image: postgres:16
        environment:
          POSTGRES_PASSWORD: password
      - image: mongo:7
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            npm install --global pnpm@12.4.1
      - run:
          name: Install dependencies
          command: pnpm i
      - run:
          name: Build
          command: pnpm run build
      - run:
          name: Lint
          command: pnpm run format:check
      - run:
          name: Unit Test
          command: pnpm run test:unit --maxConcurrency=1 # CircleCI runs out of mem
      - run:
          name: Wait for integration infra
          command: |
            wait_for_port() {
              for i in $(seq 1 60); do
                node -e "require('net').connect($1, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))" && return 0
                sleep 2
              done
              echo "Timed out waiting for port $1" && return 1
            }
            wait_for_port 5672
            wait_for_port 5432
            wait_for_port 27017
            for i in $(seq 1 60); do
              curl -sf http://127.0.0.1:4566/_localstack/health | grep -q '"sqs": "\(available\|running\)"' && break
              sleep 2
            done
            curl -sf http://127.0.0.1:4566/_localstack/health
      - run:
          name: Integration Test
          command: pnpm run test:integration
      # Save workspace for subsequent jobs (i.e. test)
      - persist_to_workspace:
          root: .
          paths:
            - .

  deploy:
    <<: *defaults
    steps:
      # Reuse the workspace from the build job
      - attach_workspace:
          at: .
      - restore_cache:
          name: Restore pnpm Package Cache
          keys:
            - pnpm-packages-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install pnpm package manager
          command: |
            npm install --global pnpm@12.4.1
      - run:
          name: Authenticate with registry
          command: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/repo/.npmrc
      - run:
          name: Publish
          # Publishes every package whose version isn't on npm yet, so it's a
          # no-op until a "version packages" commit lands. Tags are created by
          # the GitHub Releases step, not locally.
          command: pnpm changeset publish --no-git-tag
      - run:
          name: Create GitHub Releases
          # Needs a GITHUB_TOKEN project environment variable (see CONTRIBUTING.md)
          command: node .circleci/create-github-releases.mjs

workflows:
  build-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - master
