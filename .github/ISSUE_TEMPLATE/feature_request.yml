name: Feature request
description: Suggest a new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project is maintained in spare time, so requests may not get a response. Open an issue here before you start a large PR.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
