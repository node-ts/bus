# Local infrastructure for the adapter integration tests (`pnpm test:integration`).
# Ports match the defaults the tests use; override them with the env vars
# documented in test.env if you map them elsewhere.
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns,iam,sts
    ports:
      - '4566:4566'

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - '6432:5432'

  redis:
    image: redis:8
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # Optional: run the Redis transport's tests against Valkey with
  # REDIS_URL=redis://localhost:6381
  valkey:
    image: valkey/valkey:8
    ports:
      - '6381:6379'
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7
    # A single-node replica set, since the outbox's transactions need one. The
    # healthcheck initiates it, and reports healthy once it's primary.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 2s
      timeout: 10s
      retries: 30

  # Microsoft's Service Bus emulator, for bus-azure-service-bus. It needs SQL
  # Server and about 2 GB of RAM, so it only starts with its profile:
  #   docker compose --profile azure-service-bus up -d
  # Starting it accepts the licences of both images (ACCEPT_EULA):
  # https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt
  # and https://go.microsoft.com/fwlink/?LinkId=746388. AMQP is on 5673, since
  # RabbitMQ has 5672, and the management API and /health are on 5300.
  servicebus:
    profiles: ['azure-service-bus']
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    volumes:
      - ./packages/bus-azure-service-bus/emulator/config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: 'Emulator_Passw0rd'
      ACCEPT_EULA: 'Y'
    ports:
      - '5673:5672'
      - '5300:5300'
    depends_on:
      - servicebus-sql

  servicebus-sql:
    profiles: ['azure-service-bus']
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      MSSQL_SA_PASSWORD: 'Emulator_Passw0rd'
      ACCEPT_EULA: 'Y'
