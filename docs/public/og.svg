<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Social card template. Edit the title and tagline below, then render og.png
    (1200x630) from it, e.g. `inkscape og.svg -o og.png` or
    `python3 -c "import cairosvg; cairosvg.svg2png(url='og.svg', write_to='og.png')"`.
    The mark is the placeholder logo from logo.svg.
  -->
  <defs>
    <linearGradient id="og-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e" />
      <stop offset="1" stop-color="#0c1d33" />
    </linearGradient>
    <linearGradient id="og-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="og-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" />
      <stop offset="1" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#og-background)" />
  <path
    d="M760 470H1060a60 60 0 0 0 0-120H900a60 60 0 0 1 0-120H1200"
    fill="none"
    stroke="#14b8a6"
    stroke-opacity="0.18"
    stroke-width="28"
    stroke-linecap="round"
  />
  <g transform="translate(96 120) scale(2)">
    <rect width="64" height="64" rx="15" fill="url(#og-mark)" />
    <path
      d="M14 18H40a7 7 0 0 1 0 14H24a7 7 0 0 0 0 14H50"
      fill="none"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="14" cy="18" r="5.5" fill="#ffffff" />
    <circle cx="32" cy="32" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="3" />
    <circle cx="50" cy="46" r="5.5" fill="#ffffff" />
  </g>
  <text x="96" y="372" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="url(#og-title)" letter-spacing="-2">@node-ts/bus</text>
  <text x="96" y="446" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" fill="#ccfbf1">Message-driven Node.js applications in TypeScript</text>
  <text x="96" y="520" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="26" fill="#5eead4">bus.node-ts.com</text>
</svg>
